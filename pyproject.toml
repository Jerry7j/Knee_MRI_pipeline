[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knee-mri-pipeline"
version = "0.1.0"
description = "Modular KneeXNet 2.5D and 3D segmentation research pipeline"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24,<3", "Pillow>=10", "torch==2.6.0",
  "torchvision==0.21.0", "segmentation-models-pytorch>=0.4,<0.6",
  "matplotlib>=3.7", "tqdm>=4.65"
]

[project.optional-dependencies]
volume = ["monai>=1.3,<2", "nibabel>=5", "SimpleITK>=2.3"]
localization = ["ultralytics>=8.3,<9", "PyYAML>=6", "SimpleITK>=2.3"]
app = ["streamlit>=1.40,<2", "pydicom>=3", "ultralytics>=8.3,<9", "opencv-python>=4.8"]
dev = ["pytest>=7"]

[project.scripts]
knee-mri = "knee_mri.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["README.md", "README.zh-CN.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
